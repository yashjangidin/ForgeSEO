@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');:root{--bg:#f7f5f0;--paper:#fff;--ink:#171717;--line:#e3ded7;--gold:#f5b800}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}a{text-decoration:none;color:inherit}.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:22px;padding:14px 42px}.logo{display:inline-flex;align-items:center;font-weight:800;font-size:.95rem;max-width:250px}.logo img{height:50px;max-width:190px;object-fit:contain}.logo span{display:inline-block}nav ul{list-style:none;display:flex;align-items:center;gap:24px;font-size:.9rem;font-weight:700}.dropdown{position:relative}.dropdown-toggle{background:none;border:0;font:inherit;font-weight:700;cursor:pointer}.caret{font-size:.72rem;margin-left:5px}.dropdown-menu{position:absolute;top:calc(100% + 12px);left:0;min-width:250px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 45px rgba(0,0,0,.13);padding:8px;display:none}.dropdown.open .dropdown-menu,.dropdown:focus-within .dropdown-menu{display:block}.dropdown-menu a{display:block;padding:11px 12px}.cta{background:var(--gold);padding:13px 17px;font-size:.82rem;font-weight:800}.page-hero{background:#ead2cf;padding:78px 42px}.page-hero div{max-width:980px;margin:0 auto}.page-hero h1{font-size:clamp(2rem,4vw,3.2rem)}main{max-width:980px;margin:0 auto;padding:46px 34px 76px}.contact-wrap{max-width:980px;margin:0 auto}.contact-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.contact-card{background:#fff;border:1px solid var(--line);padding:24px}.contact-card h2{margin-bottom:10px}.sub{color:#555;margin-bottom:18px}.field{display:grid;gap:6px;margin-bottom:12px}.field input,.field textarea{width:100%;border:1px solid var(--line);padding:11px;font:inherit}.field textarea{min-height:130px}.submit-btn{background:#050505;color:#fff;border:0;padding:13px 18px;font-weight:800}.contact-details-list{list-style:none;display:grid;gap:12px}.contact-details-list li{display:grid;gap:4px}.contact-details-list span{color:#555}.map-card iframe{width:100%;min-height:420px;border:0}.details-only{max-width:560px;text-align:center}footer{background:#050505;color:#fff;padding:42px}.copyright{max-width:980px;margin:0 auto;color:#aaa;font-size:.82rem}@media(max-width:900px){.topbar{padding:14px 20px;align-items:flex-start}nav ul{gap:14px;flex-wrap:wrap;justify-content:flex-end}.dropdown-menu{left:auto;right:0}.contact-layout{grid-template-columns:1fr}main{padding-left:22px;padding-right:22px}}</style></head><body>

<script>document.getElementById('services-toggle')?.addEventListener('click',(event)=>{event.preventDefault();event.currentTarget.closest('.dropdown').classList.toggle('open');});</script></body></html>
